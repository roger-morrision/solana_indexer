name: terminal-dex-data

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to a reviewed PostgreSQL 18 image digest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: terminal_dex
      POSTGRES_USER: terminal_dex
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terminal_dex -d terminal_dex"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:?Set CLICKHOUSE_IMAGE to a reviewed ClickHouse image digest}
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: terminal_dex
      CLICKHOUSE_USER: terminal_dex
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    secrets: [clickhouse_password]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:8123:8123", "127.0.0.1:9000:9000"]
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    security_opt: ["no-new-privileges:true"]

  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE to a reviewed Redis Open Source image digest}
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets: [redis_password]
    volumes: ["redis-data:/data"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt: ["no-new-privileges:true"]

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  clickhouse_password: { file: ./secrets/clickhouse_password }
  redis_password: { file: ./secrets/redis_password }

volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  redis-data:
