worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 4096; }
http {
  access_log /dev/stdout combined;
  error_log /dev/stderr warn;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  upstream indexer { server host.docker.internal:8787; keepalive 64; }
  server {
    listen 8443 ssl;
    server_tokens off;
    ssl_certificate /run/secrets/gateway_certificate;
    ssl_certificate_key /run/secrets/gateway_private_key;
    ssl_client_certificate /run/secrets/client_ca_certificate;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 64k;
    location / {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://indexer;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Client-Certificate-Subject $ssl_client_s_dn;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 75s;
    }
  }
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
}
