groups:
  - name: terminal-dex-indexer
    rules:
      - alert: TerminalDexIndexerUnavailable
        expr: up{job="terminal-dex-indexer"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Terminal DEX indexer metrics endpoint is unavailable" }
      - alert: TerminalDexIndexerStale
        expr: terminal_dex_index_healthy == 0 or terminal_dex_index_age_seconds > 120
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Canonical Solana index is stale or unhealthy" }
      - alert: TerminalDexIndexStateQuarantined
        expr: terminal_dex_index_state_quarantined == 1
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Persisted index state is quarantined; serving, ingestion, publication, cleanup, and recovery qualification are suspended" }
      - alert: TerminalDexDeadLetters
        expr: terminal_dex_dead_letters > 0
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Indexer has unresolved dead-letter evidence" }
      - alert: TerminalDexDeadLetterRetriesDue
        expr: terminal_dex_dead_letter_retries{state="due"} > 0 or terminal_dex_dead_letter_retries{state="legacy"} > 0
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Due or legacy dead-letter work is not being consumed by the index loop" }
      - alert: TerminalDexExporterStale
        expr: terminal_dex_exporter_healthy == 0 or terminal_dex_exporter_age_seconds > 120
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Finalized Solana exporter is unavailable, stale, or non-finalized" }
      - alert: TerminalDexExporterFailures
        expr: terminal_dex_exporter_consecutive_failures > 0
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Solana exporter is repeatedly failing; inspect redacted durable status evidence" }
      - alert: TerminalDexWarehouseUnhealthy
        expr: terminal_dex_warehouse_healthy == 0 or terminal_dex_warehouse_age_seconds > 300 or terminal_dex_warehouse_lag_events > 1000
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Canonical warehouse synchronization is unavailable, stale, lagged, or outside retained replay history" }
      - alert: TerminalDexBackupRpoMissed
        expr: terminal_dex_backup_healthy == 0 or terminal_dex_backup_age_seconds > 86400
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "No valid completed self-hosted backup is inside the 24-hour restore-point objective" }
      - alert: TerminalDexRecoveryRehearsalExpired
        expr: terminal_dex_recovery_qualified == 0 or terminal_dex_recovery_qualification_age_seconds > 7776000
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "No canonical isolated recovery qualification is inside the quarterly rehearsal window" }
      - alert: TerminalDexHttpErrors
        expr: rate(terminal_dex_http_requests_total{status_class="5xx"}[5m]) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Indexer HTTP 5xx rate exceeds the production objective" }
      - alert: TerminalDexInternalFailures
        expr: sum(increase(terminal_dex_internal_failures_total[5m])) > 0
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "Indexer API quote, preparation, or server operation failed unexpectedly; inspect redacted diagnostics" }
      - alert: TerminalDexAuditSinkFailures
        expr: increase(terminal_dex_api_audit_failures_total[5m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Durable API audit writes failed and protected routes are failing closed" }
      - alert: TerminalDexDistributedQuotaFailures
        expr: increase(terminal_dex_distributed_quota_failures_total[5m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Redis distributed quota admission has failed closed" }
      - alert: TerminalDexWebSocketCapacityRejected
        expr: increase(terminal_dex_websocket_capacity_rejections_total[5m]) > 0
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "WebSocket clients are being rejected at the configured connection ceiling" }
      - alert: TerminalDexWebSocketBackpressure
        expr: increase(terminal_dex_websocket_slow_consumer_evictions_total[5m]) > 0
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "WebSocket clients are being evicted by bounded backpressure" }
      - alert: TerminalDexWebSocketProtocolAbuse
        expr: increase(terminal_dex_websocket_protocol_closes_total[5m]) > 100
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "WebSocket protocol-error closes exceed the abuse or incompatibility threshold" }
