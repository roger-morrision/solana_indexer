groups:
  - name: terminal-dex-indexer
    rules:
      - alert: TerminalDexIndexerUnavailable
        expr: up{job="terminal-dex-indexer"} == 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Terminal DEX indexer metrics endpoint is unavailable" }
      - alert: TerminalDexIndexerStale
        expr: terminal_dex_index_healthy == 0 or terminal_dex_index_age_seconds > 120
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Canonical Solana index is stale or unhealthy" }
      - alert: TerminalDexIndexStateQuarantined
        expr: terminal_dex_index_state_quarantined == 1
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Persisted index state is quarantined; serving, ingestion, publication, cleanup, and recovery qualification are suspended" }
      - alert: TerminalDexDeadLetters
        expr: terminal_dex_dead_letters > 0
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Indexer has unresolved dead-letter evidence" }
      - alert: TerminalDexExporterStale
        expr: terminal_dex_exporter_healthy == 0 or terminal_dex_exporter_age_seconds > 120
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Finalized Solana exporter is unavailable, stale, or non-finalized" }
      - alert: TerminalDexExporterFailures
        expr: terminal_dex_exporter_consecutive_failures > 0
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Solana exporter is repeatedly failing; inspect redacted durable status evidence" }
      - alert: TerminalDexWarehouseUnhealthy
        expr: terminal_dex_warehouse_healthy == 0 or terminal_dex_warehouse_age_seconds > 300 or terminal_dex_warehouse_lag_events > 1000
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Canonical warehouse synchronization is unavailable, stale, lagged, or outside retained replay history" }
      - alert: TerminalDexHttpErrors
        expr: rate(terminal_dex_http_requests_total{status_class="5xx"}[5m]) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Indexer HTTP 5xx rate exceeds the production objective" }
      - alert: TerminalDexDistributedQuotaFailures
        expr: increase(terminal_dex_distributed_quota_failures_total[5m]) > 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Redis distributed quota admission has failed closed" }
