rule_files:
  - alerts.yaml
evaluation_interval: 1m
tests:
  - name: canonical monitoring evidence remains quiet
    interval: 1m
    input_series:
      - series: terminal_dex_dead_letter_retry_canonical
        values: 1 1
      - series: terminal_dex_holder_exclusions_observed_in_future
        values: 0 0
      - series: terminal_dex_index_source_tip_slot
        values: 120 120
      - series: terminal_dex_index_tip_slot
        values: 100 100
      - series: terminal_dex_index_export_lag_slots
        values: 20 20
    alert_rule_test:
      - eval_time: 1m
        alertname: TerminalDexDeadLetterRetryEvidenceInvalid
        exp_alerts: []
      - eval_time: 1m
        alertname: TerminalDexHolderExclusionsFutureDated
        exp_alerts: []
      - eval_time: 1m
        alertname: TerminalDexIndexProgressInconsistent
        exp_alerts: []
  - name: finite monitoring contradictions
    interval: 1m
    input_series:
      - series: terminal_dex_dead_letter_retry_canonical
        values: 0 0
      - series: terminal_dex_holder_exclusions_observed_in_future
        values: 1 1
      - series: terminal_dex_index_source_tip_slot
        values: 120 120
      - series: terminal_dex_index_tip_slot
        values: 100 100
      - series: terminal_dex_index_export_lag_slots
        values: 19 19
    alert_rule_test:
      - eval_time: 0m
        alertname: TerminalDexDeadLetterRetryEvidenceInvalid
        exp_alerts: []
      - eval_time: 0m
        alertname: TerminalDexHolderExclusionsFutureDated
        exp_alerts: []
      - eval_time: 0m
        alertname: TerminalDexIndexProgressInconsistent
        exp_alerts: []
      - eval_time: 1m
        alertname: TerminalDexDeadLetterRetryEvidenceInvalid
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Dead-letter retry evidence is structurally invalid or contains legacy unscheduled work" }
      - eval_time: 1m
        alertname: TerminalDexHolderExclusionsFutureDated
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Reviewed holder-exclusion governance evidence is future-dated and must not affect risk decisions" }
      - eval_time: 1m
        alertname: TerminalDexIndexProgressInconsistent
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Indexed tip, provider source tip, and export lag do not satisfy the canonical progress relationship" }
  - name: missing series fail closed
    interval: 1m
    alert_rule_test:
      - eval_time: 0m
        alertname: TerminalDexDeadLetterRetryEvidenceInvalid
        exp_alerts: []
      - eval_time: 0m
        alertname: TerminalDexHolderExclusionsFutureDated
        exp_alerts: []
      - eval_time: 0m
        alertname: TerminalDexIndexProgressInconsistent
        exp_alerts: []
      - eval_time: 1m
        alertname: TerminalDexDeadLetterRetryEvidenceInvalid
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Dead-letter retry evidence is structurally invalid or contains legacy unscheduled work" }
      - eval_time: 1m
        alertname: TerminalDexHolderExclusionsFutureDated
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Reviewed holder-exclusion governance evidence is future-dated and must not affect risk decisions" }
      - eval_time: 1m
        alertname: TerminalDexIndexProgressInconsistent
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Indexed tip, provider source tip, and export lag do not satisfy the canonical progress relationship" }
  - name: transient contradictions recover before hold
    interval: 30s
    input_series:
      - series: terminal_dex_dead_letter_retry_canonical
        values: 0 1 1
      - series: terminal_dex_holder_exclusions_observed_in_future
        values: 1 0 0
      - series: terminal_dex_index_source_tip_slot
        values: 120 120 120
      - series: terminal_dex_index_tip_slot
        values: 100 100 100
      - series: terminal_dex_index_export_lag_slots
        values: 19 20 20
    alert_rule_test:
      - eval_time: 1m
        alertname: TerminalDexDeadLetterRetryEvidenceInvalid
        exp_alerts: []
      - eval_time: 1m
        alertname: TerminalDexHolderExclusionsFutureDated
        exp_alerts: []
      - eval_time: 1m
        alertname: TerminalDexIndexProgressInconsistent
        exp_alerts: []
  - name: transient missing series recover before hold
    interval: 30s
    input_series:
      - series: terminal_dex_dead_letter_retry_canonical
        values: _ 1 1
      - series: terminal_dex_holder_exclusions_observed_in_future
        values: _ 0 0
      - series: terminal_dex_index_source_tip_slot
        values: _ 120 120
      - series: terminal_dex_index_tip_slot
        values: 100 100 100
      - series: terminal_dex_index_export_lag_slots
        values: 20 20 20
    alert_rule_test:
      - eval_time: 1m
        alertname: TerminalDexDeadLetterRetryEvidenceInvalid
        exp_alerts: []
      - eval_time: 1m
        alertname: TerminalDexHolderExclusionsFutureDated
        exp_alerts: []
      - eval_time: 1m
        alertname: TerminalDexIndexProgressInconsistent
        exp_alerts: []
  - name: sustained contradictions fire at hold and clear after recovery
    interval: 30s
    input_series:
      - series: terminal_dex_dead_letter_retry_canonical
        values: 0 0 0 1
      - series: terminal_dex_holder_exclusions_observed_in_future
        values: 1 1 1 0
      - series: terminal_dex_index_source_tip_slot
        values: 120 120 120 120
      - series: terminal_dex_index_tip_slot
        values: 100 100 100 100
      - series: terminal_dex_index_export_lag_slots
        values: 19 19 19 20
    alert_rule_test:
      - eval_time: 1m
        alertname: TerminalDexDeadLetterRetryEvidenceInvalid
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Dead-letter retry evidence is structurally invalid or contains legacy unscheduled work" }
      - eval_time: 1m
        alertname: TerminalDexHolderExclusionsFutureDated
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Reviewed holder-exclusion governance evidence is future-dated and must not affect risk decisions" }
      - eval_time: 1m
        alertname: TerminalDexIndexProgressInconsistent
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Indexed tip, provider source tip, and export lag do not satisfy the canonical progress relationship" }
      - eval_time: 1m30s
        alertname: TerminalDexDeadLetterRetryEvidenceInvalid
        exp_alerts: []
      - eval_time: 1m30s
        alertname: TerminalDexHolderExclusionsFutureDated
        exp_alerts: []
      - eval_time: 1m30s
        alertname: TerminalDexIndexProgressInconsistent
        exp_alerts: []
  - name: sustained missing series fire at hold and clear after recovery
    interval: 30s
    input_series:
      - series: terminal_dex_dead_letter_retry_canonical
        values: _ _ _ 1
      - series: terminal_dex_holder_exclusions_observed_in_future
        values: _ _ _ 0
      - series: terminal_dex_index_source_tip_slot
        values: _ _ _ 120
      - series: terminal_dex_index_tip_slot
        values: 100 100 100 100
      - series: terminal_dex_index_export_lag_slots
        values: 20 20 20 20
    alert_rule_test:
      - eval_time: 1m
        alertname: TerminalDexDeadLetterRetryEvidenceInvalid
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Dead-letter retry evidence is structurally invalid or contains legacy unscheduled work" }
      - eval_time: 1m
        alertname: TerminalDexHolderExclusionsFutureDated
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Reviewed holder-exclusion governance evidence is future-dated and must not affect risk decisions" }
      - eval_time: 1m
        alertname: TerminalDexIndexProgressInconsistent
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Indexed tip, provider source tip, and export lag do not satisfy the canonical progress relationship" }
      - eval_time: 1m30s
        alertname: TerminalDexDeadLetterRetryEvidenceInvalid
        exp_alerts: []
      - eval_time: 1m30s
        alertname: TerminalDexHolderExclusionsFutureDated
        exp_alerts: []
      - eval_time: 1m30s
        alertname: TerminalDexIndexProgressInconsistent
        exp_alerts: []
  - name: present NaN partial progress remains supported
    interval: 1m
    input_series:
      - series: terminal_dex_dead_letter_retry_canonical
        values: 1 1
      - series: terminal_dex_holder_exclusions_observed_in_future
        values: 0 0
      - series: terminal_dex_index_source_tip_slot
        values: NaN NaN
      - series: terminal_dex_index_tip_slot
        values: 100 100
      - series: terminal_dex_index_export_lag_slots
        values: NaN NaN
    alert_rule_test:
      - eval_time: 1m
        alertname: TerminalDexIndexProgressInconsistent
        exp_alerts: []
  - name: missing index tip fails closed
    interval: 1m
    input_series:
      - series: terminal_dex_index_source_tip_slot
        values: 120 120
      - series: terminal_dex_index_export_lag_slots
        values: 20 20
    alert_rule_test:
      - eval_time: 1m
        alertname: TerminalDexIndexProgressInconsistent
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Indexed tip, provider source tip, and export lag do not satisfy the canonical progress relationship" }
  - name: missing source tip fails closed
    interval: 1m
    input_series:
      - series: terminal_dex_index_tip_slot
        values: 100 100
      - series: terminal_dex_index_export_lag_slots
        values: 20 20
    alert_rule_test:
      - eval_time: 1m
        alertname: TerminalDexIndexProgressInconsistent
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Indexed tip, provider source tip, and export lag do not satisfy the canonical progress relationship" }
  - name: missing export lag fails closed
    interval: 1m
    input_series:
      - series: terminal_dex_index_source_tip_slot
        values: 120 120
      - series: terminal_dex_index_tip_slot
        values: 100 100
    alert_rule_test:
      - eval_time: 1m
        alertname: TerminalDexIndexProgressInconsistent
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Indexed tip, provider source tip, and export lag do not satisfy the canonical progress relationship" }
  - name: missing retry canonicality fails closed
    interval: 1m
    input_series:
      - series: terminal_dex_holder_exclusions_observed_in_future
        values: 0 0
      - series: terminal_dex_index_source_tip_slot
        values: 120 120
      - series: terminal_dex_index_tip_slot
        values: 100 100
      - series: terminal_dex_index_export_lag_slots
        values: 20 20
    alert_rule_test:
      - eval_time: 1m
        alertname: TerminalDexDeadLetterRetryEvidenceInvalid
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Dead-letter retry evidence is structurally invalid or contains legacy unscheduled work" }
  - name: missing exclusion future state fails closed
    interval: 1m
    input_series:
      - series: terminal_dex_dead_letter_retry_canonical
        values: 1 1
      - series: terminal_dex_index_source_tip_slot
        values: 120 120
      - series: terminal_dex_index_tip_slot
        values: 100 100
      - series: terminal_dex_index_export_lag_slots
        values: 20 20
    alert_rule_test:
      - eval_time: 1m
        alertname: TerminalDexHolderExclusionsFutureDated
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "Reviewed holder-exclusion governance evidence is future-dated and must not affect risk decisions" }
