<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Solana Indexer</title><style>body{margin:0;background:#07111d;color:#dbeafe;font:15px system-ui}main{max-width:1100px;margin:auto;padding:32px}h1{color:#5eead4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card,table{background:#0f2033;border:1px solid #24415d;border-radius:10px;padding:16px}.value{font-size:28px;font-weight:700}table{width:100%;margin-top:20px;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #24415d}small{color:#8ba7c1}</style></head><body><main><h1>Local Solana Indexer</h1><p>No hosted RPC, API, or WebSocket dependencies.</p><div class="grid" id="stats"></div><h2>Indexed mint activity</h2><table><thead><tr><th>Mint</th><th>Transfers</th><th>Last slot</th></tr></thead><tbody id="tokens"></tbody></table></main><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const [s,t]=await Promise.all([fetch('/api/stats').then(r=>r.json()),fetch('/api/trending?limit=50').then(r=>r.json())]);stats.innerHTML=['tip','blocks','transactions','transfers','accounts','mints'].map(k=>`<div class="card"><small>${esc(k)}</small><div class="value">${esc(s[k]??0)}</div></div>`).join('');tokens.innerHTML=t.tokens.map(x=>`<tr><td>${esc(x.mint)}</td><td>${esc(x.transferCount)}</td><td>${esc(x.lastSlot)}</td></tr>`).join('')}load();setInterval(load,5000)</script></body></html>
